<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F87AC" />
      <stop offset="50%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#D97728" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)" />
  <!-- Inner circular target ring -->
  <circle cx="256" cy="256" r="160" stroke="#ffffff" stroke-width="20" stroke-opacity="0.35" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="105" stroke="#ffffff" stroke-width="16" stroke-opacity="0.6" />
  <!-- Center Verified Check Shield -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="64" fill="#ffffff" />
    <path d="M236 256l16 16 36-36" stroke="#0F87AC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Pulse Dot -->
  <circle cx="360" cy="150" r="18" fill="#FACC15" />
</svg>
